steps:
  # Build image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/eye-of-melinda', '.']

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/eye-of-melinda']

  # Deploy using services.yaml
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'services.yaml'
      - '--region'
      - 'asia-south1'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/backend-repo/eye-of-melinda'

options:
  logging: CLOUD_LOGGING_ONLY